############################################################
# APPLICATION
############################################################
spring.application.name=w-mart
server.port=8080

############################################################
# JSP VIEW RESOLVER
############################################################
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

############################################################
# DEVTOOLS (Development Only)
############################################################
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

############################################################
# STATIC RESOURCE CACHE (Development Only)
############################################################
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

############################################################
# FILE UPLOAD
############################################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

############################################################
# DATABASE
############################################################
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

############################################################
# JPA / HIBERNATE
############################################################

# validate  -> Validate database schema only (Recommended)
spring.jpa.hibernate.ddl-auto=update

# create    -> Create tables every startup
# spring.jpa.hibernate.ddl-auto=create

# update    -> Update schema automatically
# spring.jpa.hibernate.ddl-auto=update

# create-drop -> Create on startup & Drop on shutdown
# spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.open-in-view=false

# Enable SQL logs while development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

############################################################
# REDIS (Enable when using Redis)
############################################################

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

############################################################
# KAFKA (Enable when Kafka is running)
############################################################

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.fail-fast=false

############################################################
# JWT
############################################################

# Replace with Environment Variable in Production
localb2b.auth.jwt-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET

localb2b.auth.access-token-minutes=60
localb2b.auth.refresh-token-days=14

