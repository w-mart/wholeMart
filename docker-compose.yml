services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: localb2b
      POSTGRES_USER: localb2b
      POSTGRES_PASSWORD: localb2b
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"

volumes:
  postgres-data:
