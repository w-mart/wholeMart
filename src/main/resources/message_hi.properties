# --- FAQ ---
faq.badge=अक्सर पूछे जाने वाले प्रश्न
faq.title=वह सब कुछ जो आपको जानना आवश्यक है
faq.subtitle=होलमार्ट, ऑनबोर्डिंग, ऑर्डरिंग, डिलीवरी और एआई-संचालित संचालन के बारे में सामान्य प्रश्नों के उत्तर प्राप्त करें।
faq.q1=होलमार्ट का उपयोग कौन कर सकता है?
faq.a1=होलमार्ट रिटेलर्स (दुकानदारों), डिस्ट्रीब्यूटर्स (थोक विक्रेताओं), डिलीवरी पार्टनर्स (ड्राइवर्स) और मार्केटप्लेस प्रशासकों के लिए डिज़ाइन किया गया है।
faq.q2=क्या रिटेलर कई डिस्ट्रीब्यूटर्स से खरीदारी कर सकते हैं?
faq.a2=हाँ। रिटेलर थोक ऑर्डर देने से पहले डिस्ट्रीब्यूटर्स, कीमतों और स्टॉक उपलब्धता की तुलना कर सकते हैं।
faq.q3=क्या होलमार्ट एआई सिफारिशों का समर्थन करता है?
faq.a3=हाँ। हमारा अंतर्निहित एआई रीऑर्डर का पूर्वानुमान लगाता है, इन्वेंट्री समाप्ति जोखिमों को रोकता है और डिलीवरी मार्गों को अनुकूलित करता है।
faq.q4=क्या डिलीवरी ट्रैकिंग उपलब्ध है?
faq.a4=हाँ। ड्राइवर्स डिलीवरी स्थिति अपडेट कर सकते हैं जबकि रिटेलर और डिस्ट्रीब्यूटर रियल-टाइम में ऑर्डर ट्रैक कर सकते हैं।
faq.q5=मेरा व्यावसायिक डेटा कैसे सुरक्षित रखा जाता है?
faq.a5=सभी डेटा इन-ट्रांजिट और एट-रेस्ट एन्क्रिप्टेड है, पहुंच भूमिका-आधारित है, और प्रत्येक महत्वपूर्ण कार्रवाई ऑडिट लॉग में दर्ज की जाती है।
faq.q6=क्या मैं एक खाते के तहत एक से अधिक शाखाएं या गोदाम चला सकता हूँ?
faq.a6=हाँ। मल्टी-ब्रांच सपोर्ट प्रत्येक स्थान के लिए अलग स्टॉक, स्टाफ एक्सेस और मूल्य निर्धारण रखता है जबकि रिपोर्टिंग एक ही खाते में समेकित होती है।

