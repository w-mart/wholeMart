# --- FAQ ---
faq.badge=अक्सर पूछे जाने वाले प्रश्न
faq.title=वह सब कुछ जो आपको जानना आवश्यक है
faq.subtitle=होलमार्ट, ऑनबोर्डिंग, ऑर्डरिंग, डिलीवरी और एआई-संचालित संचालन के बारे में सामान्य प्रश्नों के उत्तर खोजें।
faq.q1=होलमार्ट का उपयोग कौन कर सकता है?
faq.a1=होलमार्ट खुदरा विक्रेताओं, वितरकों, डिलीवरी भागीदारों और बाज़ार प्रशासकों के लिए डिज़ाइन किया गया है।
faq.q2=क्या खुदरा विक्रेता कई वितरकों से खरीद सकते हैं?
faq.a2=हाँ। खुदरा विक्रेता थोक ऑर्डर देने से पहले वितरकों, कीमतों और उपलब्धता की तुलना कर सकते हैं।
faq.q3=क्या होलमार्ट एआई सिफारिशों का समर्थन करता है?
faq.a3=हाँ। AI मांग की भविष्यवाणी करने, इन्वेंट्री का अनुकूलन करने, रीऑर्डर की सिफारिश करने और डिलीवरी दक्षता में सुधार करने में मदद करता है।
faq.q4=क्या डिलीवरी ट्रैकिंग उपलब्ध है?
faq.a4=हाँ। ड्राइवर डिलीवरी की स्थिति को अपडेट कर सकते हैं जबकि खुदरा विक्रेता और वितरक वास्तविक समय में ऑर्डर ट्रैक कर सकते हैं।
faq.q5=मेरा व्यावसायिक डेटा कैसे सुरक्षित रखा जाता है?
faq.a5=सभी डेटा पारगमन और आराम पर एन्क्रिप्ट किया गया है, पहुंच भूमिका-आधारित है, और प्रत्येक महत्वपूर्ण कार्रवाई एक ऑडिट लॉग में दर्ज की जाती है।
faq.q6=क्या मैं एक खाते के तहत एक से अधिक शाखा या गोदाम चला सकता हूँ?
faq.a6=हाँ। मल्टी-ब्रांच समर्थन स्टॉक, स्टाफ एक्सेस और मूल्य निर्धारण को प्रति स्थान अलग रखता है जबकि रिपोर्टिंग एक खाते में रोल अप हो जाती है।

