# --- FAQ ---
faq.badge=FREQUENTLY ASKED QUESTIONS
faq.title=Everything You Need To Know
faq.subtitle=Find answers to common questions about WholeMart, onboarding, ordering, delivery and AI-powered operations.
faq.q1=Who can use WholeMart?
faq.a1=WholeMart is designed for retailers, distributors, delivery partners and marketplace administrators.
faq.q2=Can retailers buy from multiple distributors?
faq.a2=Yes. Retailers can compare distributors, prices and availability before placing wholesale orders.
faq.q3=Does WholeMart support AI recommendations?
faq.a3=Yes. AI helps predict demand, optimize inventory, recommend reorders and improve delivery efficiency.
faq.q4=Is delivery tracking available?
faq.a4=Yes. Drivers can update delivery status while retailers and distributors can track orders in real time.
faq.q5=How is my business data kept secure?
faq.a5=All data is encrypted in transit and at rest, access is role-based, and every critical action is recorded in an audit log.
faq.q6=Can I run more than one branch or godown under one account?
faq.a6=Yes. Multi-branch support keeps stock, staff access and pricing separate per location while reporting rolls up to one account.

